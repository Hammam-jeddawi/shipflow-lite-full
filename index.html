
<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShipFlow Lite</title>
    <style>
      body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, 'Noto Kufi Arabic', 'Segoe UI Variable', sans-serif; background:#0f172a; color:#e2e8f0; }
      a { color:#60a5fa; text-decoration:none }
      .card { background:#111827; border:1px solid #1f2937; border-radius:14px; padding:18px; }
      .row { display:flex; gap:12px; align-items:center }
      input, select, button { border-radius:10px; border:1px solid #374151; background:#0b1324; color:#e5e7eb; padding:10px 12px; }
      button.primary { background:#0ea5e9; border-color:#0284c7; color:white; }
      button.danger { background:#ef4444; border-color:#b91c1c; color:white; }
      table { width:100%; border-collapse: collapse; }
      th, td { padding:10px; border-bottom:1px solid #243244; text-align:right }
      .muted { color:#94a3b8 }
      .container { max-width:980px; margin: 30px auto; padding: 0 16px; }
      .spacer { height:14px }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
